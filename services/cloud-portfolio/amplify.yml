version: 1
applications:
  - appRoot: services/cloud-portfolio
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - pnpm --filter cloud-portfolio run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
    backend:
      phases:
        build:
          commands:
            - corepack enable
            - export NODE_OPTIONS="--max-old-space-size=6144"
            # Explicitly install from root workspace to make hoisted modules available
            - pnpm install --no-frozen-lockfile
            # Run pipeline-deploy while referencing the relative project path or local context
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
