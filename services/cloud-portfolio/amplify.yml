version: 1
applications:
  - appRoot: services/cloud-portfolio
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - pnpm --filter cloud-portfolio run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
    backend:
      phases:
        build:
          commands:
            - corepack enable
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - pnpm install --no-frozen-lockfile
            # Localize the backend package inside appRoot to satisfy the PathNotUnderRoot boundary check
            - mkdir -p node_modules/@aws-amplify
            - rm -rf node_modules/@aws-amplify/backend
            - cp -r ../../node_modules/@aws-amplify/backend node_modules/@aws-amplify/backend
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
