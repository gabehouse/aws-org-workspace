version: 1
applications:
  - appRoot: services/cloud-portfolio
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            # Install monorepo scope using the root context
            - pnpm install --filter cloud-portfolio... --no-frozen-lockfile
        build:
          commands:
            # Set the memory allocation buffer
            - export NODE_OPTIONS="--max-old-space-size=6144"

            # 1. First, synthesize and deploy the backend resources
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug

            # 2. Now run the application build using the newly minted backend configs
            - pnpm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
