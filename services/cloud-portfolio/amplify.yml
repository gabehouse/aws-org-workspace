version: 1
applications:
  - appRoot: services/cloud-portfolio
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - pnpm --filter cloud-portfolio run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
    backend:
      phases:
        build:
          commands:
            - corepack enable
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - pnpm install --no-frozen-lockfile
            - cd services/cloud-portfolio && npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
