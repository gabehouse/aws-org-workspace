version: 1
applications:
  - appRoot: services/cloud-portfolio
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --filter cloud-portfolio --no-frozen-lockfile
        build:
          commands:
            # Memory allocation fix for the Vite/Next build engine
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - pnpm run build
      artifacts:
        baseDirectory: dist # Change to '.next' if you are using Next.js instead of Vite
        files:
          - "**/*"
    backend:
      phases:
        build:
          commands:
            - corepack enable
            # Fetch dependencies from the monorepo context with reduced concurrency overhead
            - pnpm install --filter cloud-portfolio --no-frozen-lockfile --child-concurrency=1
            # Memory allocation buffer for the AWS CDK backend synthesis engine
            - export NODE_OPTIONS="--max-old-space-size=6144"
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID